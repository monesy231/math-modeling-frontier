name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies (plotting + PDF rasterization)
        run: python -m pip install --upgrade pip && pip install matplotlib numpy pymupdf

      - name: Install minimal TeX Live for real LaTeX E2E test (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended

      - name: Run full end-to-end submission & audit test suite
        env:
          REQUIRE_LATEX_E2E: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: python -m unittest discover -s tests -v
